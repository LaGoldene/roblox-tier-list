
name: Mise a jour du catalogue Roblox

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/import_games.py"
      - ".github/workflows/update-games.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-roblox-games-v2
  cancel-in-progress: true

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importer les jeux Roblox
        run: python scripts/import_games.py

     
      - name: Enregistrer le catalogue mis a jour
        run: |
          git add games.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans games.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mise a jour automatique du catalogue"
            git push
          fi
